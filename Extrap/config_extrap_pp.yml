    file: ds_over_dplus_ratios_pp.root
    mult_bin: 0
  cent_1_10:
    file: ds_over_dplus_ratios_pp.root
    mult_bin: 1
  cent_10_30:
    file: ds_over_dplus_ratios_pp.root
    mult_bin: 2
  cent_30_50:
    file: ds_over_dplus_ratios_pp.root
    mult_bin: 3
  cent_50_70:
    file: ds_over_dplus_ratios_pp.root
    mult_bin: 4
  cent_70_100:
    file: ds_over_dplus_ratios_pp.root
    mult_bin: 5

br:
  ds_to_phipi_to_kkpi: 0.0225
  dplus_to_phipi_to_kkpi: 0.00269

extrap:
