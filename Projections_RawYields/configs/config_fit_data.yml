          fix_to_file: [false, false, false, false, false, false]
          fix_to_mb: [true, true, true, true, true, true]
        alpha:
          init: [1.48, 1.39, 1.38, 1.34, 1.37, 1.27]
          min: [0., 0., 0., 0., 0.5, 0.75]
          max: [5., 5., 5., 5., 5., 5.]
          fix_to_config_value: [false, false, false, false, false, false]
          fix_to_file: [true, true, true, true, true, true]
          fix_to_mb: [false, false, false, false, false, false]
        n:
          init: [87.14, 7.17, 6.41, 9.38, 17.03, 19.76]
          min: [3, 3, 3, 3, 3, 3]
          max: [100., 100., 100., 100., 100., 100.]
          fix_to_config_value: [false, false, false, false, false, false]
          fix_to_file: [true, true, true, true, true, true]
          fix_to_mb: [false, false, false, false, false, false]

    file_for_params_fix: /home/fchinu/Run3/Ds_Dp_ratio_PbPb/Projections_RawYields/MC/LHC25a5_norm_vars_doublecb/RawYields/mass_fits.root # path to root file. If null, no file is used
    suffix_hist_for_params_fix: "_0_100" # "" for no centrality selection, can also use cent_min, cent_max to format namea
    fix_sigma_dplus_to_ds: [true, true, true, true, true, true]
    ratio_sigma_dplus_to_ds: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9] # value, list or path to root_file. If null or empty, set dplus sigma to that of ds. Otherwise, set to ds sigma * value
  bkg:
    bkg_funcs: [['chebpol2'], ['chebpol2'], ['chebpol2'], ['chebpol2'], ['chebpol2'], ['chebpol2']]
    use_bkg_templ: [true, true, true, true, true, true]
    templ_norm:
      fix_to_file: [false, false, false, false, false, false] # set to null if no file is needed
      fix_to_mb: [false, false, false, false, false, false]
      fix_with_br: [true, true, true, true, true, true]
      file_name_for_fix: null  # can use also pt_min, pt_max, cent_min, cent_max to format name. pt variables are multiplied by 10 to avoid floating point issues
      hist_name_for_fix: h_corr_bkg_over_dplus_signal_0_100  # can use also pt_min, pt_max, cent_min, cent_max to format name. pt variables are multiplied by 10 to avoid floating point issues
      backgrounds:
      - name: $\mathrm{D^{+}}\rightarrow K^{-}\pi^{+}\pi^{+}$
        file_norm: /home/fchinu/Run3/Ds_Dp_ratio_PbPb/Projections_RawYields/MC/LHC25a5_norm_vars_doublecb/Projections/w_bdt/dplus_bkg.root # with BDT selections (for normalisation)
